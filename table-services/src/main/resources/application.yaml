micronaut:
  server:
    port: 8083
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins-regex: '^(https://tables-bar-front[a-z0-9-]*-ravik-ferreira\.vercel\.app|https://tables-bar-front-end\.vercel\.app|http://localhost:3000)$'
          allowedMethods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          allowedHeaders:
            - Content-Type
            - Authorization
    max-request-size: 5MB
    multipart:
      max-file-size: 5MB

  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

