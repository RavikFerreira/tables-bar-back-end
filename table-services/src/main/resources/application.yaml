endpoints:
  prometheus:
    sensitive: false


mongodb:
  uri: ${MONGODB_URI}

redis:
  uri: redis://localhost:6379
  ssl: true
  timeout: 30s
  io-thread-pool-size: 5
  computation-thread-pool-size: 4
  caches:
    products:
      expire-after-write: 60s

kafka:
  bootstrap:
    servers: localhost:9092

  topic:
    start: start
    notify: notify

  consumer:
    group-id: table-group
    auto-offset-reset: latest

logger:
  levels:
    org.apache.kafka: OFF






