micronaut:
  server:
    port: 8087
  security:
    enabled: true
    authentication: bearer

jwt:
  secret: "usersecretforjwtauthenticateoratoroeuaroupadoreideromalalalameudeuscomoessabencaodechave"

datasources:
  default:
    url: jdbc:postgresql://localhost:5435/login-db
    username: postgres
    password: 2503
    driverClassName: org.postgresql.Driver
    dialect: io.micronaut.data.jdbc.postgres.PostgresDialect
    maximumPoolSize: 40
    minimumIdle: 10
    connectionTimeout: 30000
    idleTimeout: 10000
    autoCommit: true
jpa:
  default:
    properties:
      hibernate.show_sql: true
      hibernate.format_sql: true
      hibernate.hbm2ddl.auto: update
    entity-scan:
      packages:
        - com.autorization.models
